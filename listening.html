<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0,
          maximum-scale=1.0, user-scalable=no"
    />

    <!-- iOS Home Screen behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Adventure Island" />

    <!-- App icons (multiple resolutions) -->
    <link rel="apple-touch-icon" href="jhs1hp.png" />

    <link rel="manifest" href="manifest.json" />

    <title>Adventure Island: JHS 2 Listening</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap"
      rel="stylesheet"
    />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --font-chalk:
          "Comic Neue", "Chalkboard SE", "Comic Sans MS", "Segoe Print",
          sans-serif;
        --colour-btn-face: #ffd600;
        --colour-btn-active: pink;
        --colour-btn-border: #000000;
        --colour-heading-text: darkorange;
        --colour-btn-brown: #8b5a2b;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        max-width: 100vw;
      }

      body {
        font-family: var(--font-chalk);
        background-color: grey;
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        min-height: 100dvh;
        overflow-y: auto;
      }

      h1 {
        font-family: var(--font-chalk);
        color: var(--colour-heading-text);
        width: 100%;
        text-align: center;
        letter-spacing: 0.03em;
        flex-shrink: 0;
        -webkit-text-stroke: 1px yellow;
      }

      .grid-wrapper {
        flex: 1 0 auto;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        width: 100%;
      }

      .btn {
        font-family: var(--font-chalk);
        font-weight: bold;
        color: yellow;
        background: var(--colour-btn-brown);
        border: 2px solid var(--colour-btn-border);
        border-radius: 10px;
        text-decoration: none;
        text-align: center;
        line-height: 1.05;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 0.6em;
        width: 100%;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-text-stroke: 1px darkorange;
        transition:
          transform 0.1s ease,
          background 0.15s ease;
      }

      .btn:active {
        transform: scale(0.97);
        background: var(--colour-btn-active);
      }

      .back-btn {
        position: fixed;
        top: max(16px, env(safe-area-inset-top, 16px));
        left: max(16px, env(safe-area-inset-left, 16px));
        z-index: 60;
        display: flex;
        align-items: center;
        gap: 0.3em;
        background: var(--colour-btn-face);
        color: var(--colour-btn-border);
        border: 2px solid var(--colour-btn-border);
        border-radius: 999px;
        padding: 0.4em 0.9em;
        font-family: var(--font-chalk);
        font-weight: bold;
        font-size: 1rem;
        text-decoration: none;
        cursor: pointer;
        -webkit-text-stroke: 0;
        transition: transform 0.1s ease;
      }
      .back-btn:active {
        transform: translateY(2px);
        background: var(--colour-btn-active);
      }

      /* LANDSCAPE: 2 columns, page scrolls */
      @media screen and (orientation: landscape) {
        body {
          background-image: url("jhs1land.png");
        }

        h1 {
          font-size: clamp(2rem, 6vw, 5rem);
          padding: 0.1em 0.5em;
          margin-top: 3vh;
        }

        .grid-wrapper {
          padding: 2vh 2vw 6vh;
        }

        .grid {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: clamp(8px, 1.6vw, 18px);
          width: min(92vw, 900px);
        }

        .btn {
          grid-column: span 2;
          font-size: clamp(0.95rem, 2.6vw, 2rem);
          height: clamp(52px, 13vh, 90px);
        }
        .btn:last-child {
          grid-column: 2 / span 2;
        }
      }

      /* LANDSCAPE IPHONE */
      @media screen and (orientation: landscape) and (max-height: 450px) {
        body {
          width: 100vw !important;
          min-width: 100vw !important;
          overflow-x: hidden !important;
        }

        h1 {
          font-size: clamp(1rem, 5vw, 2.4rem) !important;
          padding: 0.1em 0.5em !important;
          margin-top: 1vh !important;
        }

        .btn {
          height: clamp(44px, 16vh, 64px) !important;
          font-size: clamp(0.85rem, 2.4vw, 1.4rem) !important;
        }
      }

      /* PORTRAIT: single column, page scrolls */
      @media screen and (orientation: portrait) {
        body {
          background-image: url("jhs1port.png");
        }

        h1 {
          font-size: clamp(1.5rem, 10vw, 3.6rem);
          padding: 0.3em 0.5em;
          margin-top: 56px;
        }

        .grid-wrapper {
          padding: 2vw 9vw 10vw;
        }

        .grid {
          display: grid;
          grid-template-columns: 1fr;
          gap: clamp(12px, 3.5vw, 26px);
          width: 100%;
          max-width: 520px;
        }

        .btn {
          font-size: clamp(1.1rem, 6vw, 2.4rem);
          height: clamp(64px, 17vw, 110px);
        }
      }

      /* PORTRAIT IPHONE */
      @media screen and (orientation: portrait) and (max-width: 430px) {
        h1 {
          font-size: clamp(1.1rem, 8.5vw, 3rem) !important;
          padding: 0.3em 0.5em !important;
          line-height: 1;
          margin-top: max(56px, env(safe-area-inset-top, 30px)) !important;
        }

        .btn {
          height: clamp(64px, 19vw, 100px) !important;
          font-size: clamp(1.05rem, 6vw, 2rem) !important;
        }
      }
    </style>
  </head>

  <body>
    <a class="back-btn" href="index.html">← Back</a>
    <h1>JHS2 Listening</h1>

    <div class="grid-wrapper">
      <div class="grid" id="audio-grid">
        <!-- Change the text of each button to the track name -->
        <a class="btn" href="listeningjhs2-player.html?track=t1"
          >Lucy's First Day</a
        >
        <a class="btn" href="listeningjhs2-player.html?track=t2"
          >The Lost Wallet</a
        >
        <a class="btn" href="listeningjhs2-player.html?track=t3">Sumo</a>
        <a class="btn" href="listeningjhs2-player.html?track=t4"
          >Rex's Big Adventure</a
        >
        <a class="btn" href="listeningjhs2-player.html?track=t5"
          >The Mona Lisa</a
        >
        <a class="btn" href="listeningjhs2-player.html?track=t6">The U.K.</a>
        <a class="btn" href="listeningjhs2-player.html?track=t7">Unit 26</a>
        <a class="btn" href="listeningjhs2-player.html?track=t8">Unit 35a</a>
        <a class="btn" href="listeningjhs2-player.html?track=t9">Unit 35b</a>
        <a class="btn" href="listeningjhs2-player.html?track=t10">Unit 35c</a>
        <a class="btn" href="listeningjhs2-player.html?track=t11">Unit 35d</a>
      </div>
    </div>
  </body>
</html>
